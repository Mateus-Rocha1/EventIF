services:
  eventif-db:
    image: postgres:16-alpine
    container_name: eventif-db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  eventif:
    build: .
    container_name: eventif
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      eventif-db:
        condition: service_healthy

volumes:
  postgres_data:
